<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精灵世界 - 打卡小精灵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F0EB;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;color:#222;text-align:center;padding:20px}
.card{max-width:320px;width:100%;padding:30px 20px;background:white;border:3px solid #222;border-radius:18px;box-shadow:6px 6px 0 #222}
.pb{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;background:url(/images/ui/pokeball.png) center/contain no-repeat;border:3px solid #222;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
h1{font-size:22px;color:#222;margin-bottom:4px}
.sub{font-size:12px;color:#888;margin-bottom:16px}
.links{display:flex;flex-direction:column;gap:10px}
.link{display:block;padding:12px;border:2px solid #222;border-radius:10px;background:#EE1515;color:white;font-size:15px;font-weight:800;text-decoration:none;box-shadow:3px 3px 0 #222;transition:all .1s}
.link:hover{transform:translateY(-2px);box-shadow:5px 5px 0 #222}
.link.admin{background:white;color:#222}
</style>
</head>
<body>
<div class="card">
  <div class="pb"></div>
  <h1>✨ 精灵世界</h1>
  <div class="sub">打卡 · 对战 · 成长</div>
  <div class="links">
    <a class="link" href="student.html">🎮 学生登录</a>
    <a class="link admin" href="admin/">👑 管理端</a>
  </div>
</div>
</body>
</html>
