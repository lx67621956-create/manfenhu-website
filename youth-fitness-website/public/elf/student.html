<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>精灵世界</title>
  <link rel="manifest" href="/elf/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="精灵世界">

  <link rel="stylesheet" href="/elf/student.css?v=20260630">
</head>
<body>
<div class="app" id="app">
  <div class="top-bar" id="topBar"><button class="back-btn" id="backBtn">‹</button><div class="top-title" id="topTitle">返回</div></div>
  <div class="page active" id="pageLogin">
    <div class="lp">
      <div class="pb-icon"></div>
      <div class="lt">精灵<span>世界</span></div>
      <div class="ls">Pet · Battle · Grow</div>
      <div class="lpets" id="loginPets"></div>
      <div class="pkm-frame">
        <textarea id="loginName" placeholder="训练家名称" rows="1"></textarea>
        <input id="loginPwd" placeholder="密码" type="password">
        <button class="pk-btn" id="loginBtn">⚡ 进入精灵世界</button>
        <div class="lerr" id="loginError"></div>
        <div class="lh">新训练家请联系老师获取账号密码</div>
      </div>
    </div>
  </div>
  <div class="page" id="pageHome"><div id="homeContent"></div></div>
  <div class="page" id="pagePet"><div id="petContent"></div></div>
  <div class="page" id="pageBattle">
    <div class="page-header"><span class="page-title">⚔️ 精灵对战</span></div>
    <div class="ba" id="battleArena">
      <div class="bh">
        <div class="bhs"><div class="bn" id="bhN1">—</div><div class="bp" id="bhP1">—</div><div class="bhp"><div class="bhf" id="bhH1"></div></div><div class="bht" id="bhT1">HP</div></div>
        <div class="bhv">⚔️</div>
        <div class="bhs"><div class="bn" id="bhN2">—</div><div class="bp" id="bhP2">—</div><div class="bhp"><div class="bhf" id="bhH2"></div></div><div class="bht" id="bhT2">HP</div></div>
      </div>
      <div class="ba-scene">
        <div class="bf">
          <div class="bfp"><img class="be" id="bfE1" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><div class="bfn" id="bfN1">—</div></div>
          <div class="battle-vs">VS</div>
          <div class="bfp"><img class="be" id="bfE2" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><div class="bfn" id="bfN2">—</div></div>
        </div>
        <div class="blog" id="battleLog"></div>
        <div class="brs" id="battleResult"><div class="bri" id="brT">🏆</div><div class="brt2" id="brTx"></div><div class="brd2" id="brD"></div><div class="brd2 reward-text" id="brReward"></div><button id="battleAgain" class="bb mt8 battle-again">⚔️ 再来一局</button></div>
      </div>
    </div>
    <div class="bsu" id="battleSetup"></div>
    <div class="bms"><button class="bmb active" data-md="1v1">1 VS 1</button><button class="bmb" data-md="3v3">3 VS 3</button></div>
    <div class="bc2" id="battleCount"></div>
    <button class="bb" id="battleStart">🎲 随机匹配对战</button>
  </div>
  <div class="page" id="pageShop"><div class="page-header"><span class="page-title">🏪 商店</span></div><div class="sp" id="shopPts"></div><div class="sg" id="shopGrid"></div></div>
  <div class="page" id="pageRank">
    <div class="page-header"><span class="page-title">🏆 排行榜</span></div>
    <div class="rk-tabs"><button class="rk-tab active" data-rt="pts">积分榜</button><button class="rk-tab" data-rt="pets">精灵榜</button><button class="rk-tab" data-rt="battle">战斗榜</button></div>
    <div id="rankList"></div>
  </div>
  <div class="page" id="pageColl"><div class="colc"><span class="page-title">📖 图鉴</span><span class="sp" id="collC">0/30</span></div><div class="cg" id="collGrid"></div></div>
  <div class="nav" id="nav">
    <button class="nav-item active" data-pg="pageHome"><span class="ni">🏠</span>我的</button>
    <button class="nav-item" data-pg="pageBattle"><span class="ni">⚔️</span>对战</button>
    <button class="nav-item" data-pg="pageShop"><span class="ni">🏪</span>商店</button>
    <button class="nav-item" data-pg="pageRank"><span class="ni">🏆</span>排行</button>
    <button class="nav-item" data-pg="pageColl"><span class="ni">📖</span>图鉴</button>
  </div>
</div>
<div class="mo" id="modalBox"><div class="br" id="boxContent"></div></div>
<div class="toast" id="toast"></div>


  <script src="/elf/zzfx.js?v=20260630"></script>
  <script src="/elf/student.js?v=20260630"></script>
</body>
</html>
