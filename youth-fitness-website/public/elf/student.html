<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精灵世界</title>
<style>
html{height:100%}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pkred:#EE1515;--pkred2:#CC0000;--pkred3:#FF4444;
  --pkblue:#3B4CCA;--pkdark:#222;--pkgreen:#32CD32;
  --gold:#FFD700;--gold2:#FFA500;--gold3:#DAA520;
  --text:#444;--text2:#888;--text3:#AAA;
  --font:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --rl:24px;
}
body{background:#F5F0EB;font-family:var(--font);color:var(--pkdark);margin:0;padding:0;overflow-x:hidden;min-height:100dvh;min-height:-webkit-fill-available}
.app{width:100%;max-width:420px;min-height:100dvh;min-height:-webkit-fill-available;background:#F5F0EB;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:421px){.app{border-radius:var(--rl);margin:12px;border:3px solid var(--pkdark);overflow:hidden}}}
.app::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:var(--pkred);z-index:10}
.page{display:none;flex-direction:column;overflow-y:auto;padding:12px 14px;padding-top:calc(var(--st)+12px);padding-bottom:calc(var(--sb)+12px);position:relative;z-index:1}
.page.active{display:flex;flex:1;min-height:100%}
.top-bar{display:none;padding:8px 16px;background:var(--pkred);align-items:center;gap:10px;flex-shrink:0;color:white;position:relative;overflow:hidden}
.top-bar.show{display:flex}
.top-bar::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:url(/images/ui/header_bg.png) center/cover no-repeat;opacity:0.15;pointer-events:none}
.back-btn{background:none;border:none;color:rgba(255,255,255,0.8);font-size:20px;cursor:pointer;padding:4px 8px;font-family:var(--font);flex-shrink:0;font-weight:700}
.back-btn:hover{color:white}
.top-title{font-size:14px;font-weight:700;flex:1;text-align:center}
.nav{display:none;padding:4px 4px calc(var(--sb)+4px);background:white;border-top:2px solid var(--pkdark);flex-shrink:0}
.nav.show{display:flex;justify-content:space-around}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:8px;cursor:pointer;transition:all .2s;border:none;background:transparent;color:var(--text3);font-family:var(--font);font-size:9px;flex:1;font-weight:600}
.nav-item .ni{font-size:18px;line-height:1}
.nav-item.active{color:var(--pkred);background:rgba(238,21,21,0.05)}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.page-title{font-size:17px;font-weight:800;color:var(--pkdark)}

/* Login */
.lp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;min-height:-webkit-fill-available;padding:30px 20px;text-align:center}
.pb-icon{width:80px;height:80px;border-radius:50%;margin:0 auto 14px;background:url(/images/ui/pokeball.png) center/contain no-repeat;border:3px solid var(--pkdark);box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.lt{font-size:28px;font-weight:900;color:var(--pkdark);letter-spacing:1px}
.lt span{color:var(--pkred)}
.ls{font-size:11px;color:var(--text2);margin-bottom:16px;letter-spacing:3px}
.lpets{display:flex;gap:4px;justify-content:center;margin-bottom:16px;min-height:56px}
.lpets img{width:48px;height:48px;object-fit:contain;animation:pF 3s ease-in-out infinite;background:rgba(238,21,21,0.03);border-radius:10px;padding:4px;border:1px solid rgba(0,0,0,0.04)}
@keyframes pF{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pkm-frame{border:2px solid var(--pkdark);border-radius:12px;padding:20px 18px;background:white;box-shadow:4px 4px 0 var(--pkdark);width:100%;max-width:290px}
.pkm-frame input,.pkm-frame textarea{width:100%;padding:10px 12px;border:2px solid #CCC;border-radius:8px;background:#F8F8F8;color:var(--text);font-size:14px;font-family:var(--font);outline:none;text-align:center;margin-bottom:8px}
.pkm-frame input:focus{border-color:var(--pkred);background:white;box-shadow:0 0 0 2px rgba(238,21,21,0.06)}
.pk-btn{width:100%;padding:12px;border:2px solid var(--pkdark);border-radius:10px;background:var(--pkred);color:white;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);margin-top:4px;box-shadow:3px 3px 0 var(--pkdark);transition:all .1s}
.pk-btn:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--pkdark)}
.lerr{font-size:11px;color:var(--pkred);margin-top:8px;display:none}
.lh{font-size:10px;color:var(--text3);margin-top:12px}

/* Home */
.hh{text-align:center;padding:0 0 6px}
.tn{font-size:18px;font-weight:800;color:var(--pkdark)}
.tp{font-size:13px;color:var(--pkred);font-weight:700;margin-bottom:2px}
.ts{display:flex;justify-content:center;gap:6px;font-size:10px;margin-bottom:10px;flex-wrap:wrap}

.walk-area{height:110px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.walk-area .pg{width:100px;height:100px;object-fit:contain;display:block;animation:walkAcross 8s ease-in-out infinite alternate}
@keyframes walkAcross{0%{transform:translateX(-40px) scaleX(1)}45%{transform:translateX(40px) scaleX(1)}50%{transform:translateX(40px) scaleX(-1)}95%{transform:translateX(-40px) scaleX(-1)}100%{transform:translateX(-40px) scaleX(1)}}
.ps{position:relative;min-height:130px;margin-bottom:4px;text-align:center}
.pn{font-size:16px;font-weight:800;color:var(--pkdark);margin-top:1px}
.pg{width:100px;height:100px;object-fit:contain;display:block;position:relative;z-index:1;margin:0 auto}
.pw2{display:block;height:110px;position:relative;overflow:visible}

.eb{max-width:200px;margin:4px auto}
.eb .pt{height:8px;background:#F0F0F0;border-radius:6px;overflow:hidden;border:1px solid #E8E8E8}
.eb .pf{height:100%;border-radius:6px;background:linear-gradient(90deg,#FFA500,#FFD700);transition:width .5s}
.eb .et{font-size:10px;color:var(--text2);margin-top:1px;text-align:center}
.pt{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:20px;font-size:10px;font-weight:700;margin-top:1px}
.bg{display:flex;gap:6px;margin-bottom:10px}
.bi{flex:1;background:white;border:2px solid #EEE;border-radius:10px;padding:6px 8px;text-align:center}
.bi .lb{font-size:9px;color:var(--text2);margin-bottom:1px;font-weight:600}
.bi .bv{font-size:10px;margin-top:1px;font-weight:700}
.bpt{height:8px;background:#F0F0F0;border-radius:6px;overflow:hidden;border:1px solid #E8E8E8;margin:2px 0}.bpf{height:100%;border-radius:6px;transition:width .5s ease}
.ga{display:grid;gap:6px;margin-bottom:12px}
.gb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:10px;border:2px solid var(--pkdark);background:white;color:var(--pkdark);cursor:pointer;font-size:10px;font-weight:700;font-family:var(--font);box-shadow:2px 2px 0 var(--pkdark);transition:all .1s}
.gb:hover{transform:translateY(-3px);box-shadow:4px 4px 0 var(--pkdark);border-color:var(--pkred)}
.gb .gi{font-size:24px}
.gb .gc{font-size:9px;color:var(--pkred);font-weight:700}
.plt{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:800;color:var(--pkdark)}
.scroll-x{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}.scroll-x::-webkit-scrollbar{display:none;width:0;height:0}
.pli{flex-shrink:0;width:64px;height:76px;background:white;border:2px solid #E0E0E0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;transition:all .2s}
.pli:hover{transform:translateY(-3px);border-color:var(--pkred)}
.pli.cur{border-color:var(--pkdark)}
.pli .pb{position:absolute;top:1px;right:1px;font-size:7px;padding:1px 5px;border-radius:4px;background:var(--pkred);color:white;font-weight:700}
.bhl{display:flex;flex-direction:column;gap:3px}
.bhi{display:flex;align-items:center;gap:6px;background:white;border:1px solid #E0E0E0;border-radius:8px;padding:6px 8px;font-size:11px}
.brr{padding:2px 8px;border-radius:6px;font-weight:700;font-size:10px}
.brr.w{background:rgba(50,205,50,0.08);color:var(--pkgreen)}
.brr.l{background:rgba(238,21,21,0.06);color:var(--pkred)}
.bho{font-weight:600;font-size:11px}
.bhd{font-size:9px;color:var(--text3);flex:1}
.bhdt{font-size:8px;color:var(--text3)}

/* Pet Detail */
.pds{padding:8px 0}
.pdh{text-align:center;padding:4px 0}
.pdn{font-size:18px;font-weight:800;color:var(--pkdark)}
.pdtg{font-size:11px;color:var(--text2);margin-bottom:6px}
.pdl{background:white;border:2px solid var(--pkdark);border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:3px 3px 0 var(--pkdark)}
.sg2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.sc2{background:white;border:2px solid var(--pkdark);border-radius:10px;padding:6px;text-align:center;box-shadow:2px 2px 0 var(--pkdark)}
.sc2 .si2{font-size:16px}
.sc2 .sl{font-size:9px;font-weight:700}
.sc2 .sb{height:3px;background:#F0F0F0;border-radius:2px;overflow:hidden;margin-bottom:1px}
.sc2 .sf{height:100%;border-radius:2px}
.sc2 .sv{font-size:11px;font-weight:700}
.schp{color:#FF6B6B}.scatk{color:#FF4500}.scdef{color:#48D1CC}.scspd{color:#32CD32}.scint{color:#DDA0DD}.scluk{color:#FFD700}
.sfhp{background:#FF6B6B}.sfatk{background:#FF4500}.sfdef{background:#48D1CC}.sfspd{background:#32CD32}.sfint{background:#DDA0DD}.sfluk{background:#FFD700}

/* Battle */
.bsu{text-align:center;margin-bottom:6px}
.bms{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.bmb{padding:5px 18px;border-radius:16px;border:2px solid var(--pkdark);background:white;color:var(--text2);font-size:11px;cursor:pointer;font-family:var(--font);font-weight:700;transition:all .15s}
.bmb.active{background:var(--pkred);color:white;border-color:var(--pkdark);box-shadow:2px 2px 0 var(--pkdark)}
.bc2{display:flex;justify-content:center;gap:10px;margin-bottom:6px;font-size:12px}
.bb{width:100%;padding:12px;border:2px solid var(--pkdark);border-radius:10px;background:white;color:var(--pkred);font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);box-shadow:3px 3px 0 var(--pkdark);margin-bottom:8px;transition:all .1s}
.bb:disabled{opacity:0.4;cursor:not-allowed}
.ba{background:transparent;border:2px solid var(--pkdark);border-radius:12px;overflow:hidden;min-height:200px;flex:1;display:flex;flex-direction:column;box-shadow:0 4px 20px rgba(0,0,0,0.08);position:relative}
.ba::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:url(/images/ui/arena_bg.png) center/cover no-repeat;opacity:1;pointer-events:none}
.bh{display:flex;padding:8px 10px;gap:6px;background:rgba(0,0,0,0.45);position:relative;z-index:2;color:white}
.bhs{flex:1}
.bhs .bn{font-size:11px;font-weight:800;color:white}
.bhs .bp{font-size:9px;color:rgba(255,255,255,0.8);margin-bottom:2px}
.bhv{font-size:12px;font-weight:800;color:#FFD700;display:flex;align-items:center}
.bhp{height:8px;border-radius:4px;overflow:hidden;background:#F0F0F0;border:1px solid #DDD}
.bhf{height:100%;border-radius:4px;background:var(--pkgreen);transition:width .4s ease}
.bht{font-size:8px;color:rgba(255,255,255,0.7);margin-top:1px}
.bf{display:flex;justify-content:space-around;align-items:center;padding:14px 10px 10px;min-height:80px;flex:1;position:relative;z-index:2}
.bfp{text-align:center}
.bfp .be{font-size:38px;display:block;transition:all .1s}
.bfp .bfn{font-size:9px;color:var(--text2);margin-top:1px;font-weight:600}
.bl{position:relative;z-index:2;padding:8px 12px 10px;max-height:120px;overflow-y:auto;background:linear-gradient(180deg,rgba(255,255,255,0.9),white);border-top:2px solid var(--pkdark)}.bl::-webkit-scrollbar{display:none;width:0}
.blog .bli{padding:2px 0;font-size:10px;color:var(--text2)}
.blog .bli.info{color:var(--pkdark);font-weight:700}
.blog .bli.dg{color:var(--pkblue)}
.blog .bli.cr{color:var(--pkred);font-weight:700}
.brs{text-align:center;padding:10px;display:none;background:rgba(0,0,0,0.5);border-radius:10px;color:white;position:relative;z-index:2}
.blog{position:relative;z-index:2;padding:8px 12px 10px;max-height:120px;overflow-y:auto;background:linear-gradient(180deg,rgba(255,255,255,0.9),white)}
.brs.show{display:block}
.bri{font-size:36px}
.brt2{font-size:16px;font-weight:800;color:var(--pkred)}
.brd2{font-size:10px;color:var(--text2)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes dodge{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
@keyframes bxSh{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}50%{transform:rotate(0deg)}75%{transform:rotate(8deg)}}


/* Shop */
.sp{font-size:12px;color:var(--pkred);font-weight:700;background:white;border:2px solid #DDD;border-radius:8px;padding:6px 14px;display:inline-block;margin-bottom:10px}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sc{background:white;border:2px solid var(--pkdark);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;box-shadow:2px 2px 0 var(--pkdark);transition:all .15s}
.sc:hover{transform:translateY(-3px);border-color:var(--pkred);box-shadow:4px 4px 0 var(--pkred)}
.sc .si{font-size:28px;display:block}
.sc .sn{font-size:12px;font-weight:800;color:var(--pkdark)}
.sc .sd{font-size:9px;color:var(--text2)}
.sc-top{font-size:32px;padding:2px 0;text-align:center;display:block}
.sc-bot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;border-top:1px solid #E0E0E0;padding-top:6px}
.sc-price{font-size:11px;color:var(--pkred);font-weight:700}
.sc-btn{padding:4px 12px;border-radius:6px;background:var(--pkred);color:white;font-size:10px;font-weight:700;border:1px solid var(--pkdark);box-shadow:2px 2px 0 var(--pkdark);cursor:pointer;transition:all .1s}
.sc-btn:hover{transform:translateY(-1px);box-shadow:3px 3px 0 var(--pkdark)}

.sc .sc2{font-size:12px;color:var(--pkred);font-weight:800;margin-top:4px;padding:2px 8px;border-radius:6px;background:rgba(238,21,21,0.06);display:inline-block}

/* Collection */
.colc{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.ccell{background:white;border:2px solid #E0E0E0;border-radius:10px;padding:5px 3px;text-align:center;cursor:pointer;transition:all .15s}
.ccell.unlocked:hover{transform:translateY(-3px);border-color:var(--pkred);box-shadow:3px 3px 0 var(--pkred)}
.ccell.lock{opacity:0.25;background:#F5F5F5}
.ccell.cur{border-color:var(--pkdark)}
.ccell .ce{font-size:22px;display:block}
.ccell .cn{font-size:8px;color:var(--text3);font-weight:600}

/* Modals */
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:1000;align-items:center;justify-content:center}
.mo.show{display:flex}
.br{background:white;border:2px solid var(--pkdark);border-radius:16px;padding:20px;width:300px;max-width:90vw;text-align:center;box-shadow:6px 6px 0 var(--pkdark)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:8px 20px;border-radius:16px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:600}
.toast.show{opacity:1}

/* Common */
.badge{display:inline-flex;align-items:center;gap:2px;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid}
.bg-red{background:rgba(238,21,21,0.06);color:var(--pkred);border-color:rgba(238,21,21,0.12)}
.bg-green{background:rgba(50,205,50,0.06);color:var(--pkgreen);border-color:rgba(50,205,50,0.12)}
.bg-gold{background:rgba(255,215,0,0.1);color:#B8860B;border-color:rgba(255,215,0,0.2)}
.bg-blue{background:rgba(59,76,202,0.06);color:var(--pkblue);border-color:rgba(59,76,202,0.12)}
.pet-gif{width:70px;height:70px;object-fit:contain;display:inline-block;vertical-align:middle}
.pet-gif-lg{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto}
.pet-gif-xl{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto}
.pet-icon{width:30px;height:30px;object-fit:contain;display:inline-block;vertical-align:middle;border-radius:6px}
.btn-gold{padding:8px 20px;border:2px solid #B8860B;border-radius:10px;background:linear-gradient(180deg,#FFD700,#FFA500);color:#1a1a2e;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:2px 2px 0 #B8860B}
.btn-gold:hover{transform:translateY(-2px);box-shadow:4px 4px 0 #B8860B}
.confetti-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3000;overflow:hidden}
.confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:cF 3s ease-out forwards}
@keyframes cF{0%{transform:translateY(0) rotate(0deg);opacity:1}
@keyframes hitShake{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-2px)}}
@keyframes dmgFlash{0%,100%{opacity:1}50%{opacity:0.4}}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.bpk-row{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.bpk{width:52px;height:58px;border:2px solid #E0E0E0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:white;cursor:pointer;position:relative;transition:all .2s}
.bpk:hover{border-color:var(--pkred)}
.bpk.bpk-cur{border-color:#EE1515}



/* iOS + WeChat IME fix */
input,textarea,select{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:text!important}
*:not(input):not(textarea){-webkit-touch-callout:none}

input, textarea{font-size:16px!important} /* prevents iOS auto-zoom */

/* ===== WeChat iOS Chinese IME Fix ===== */
html,body{-webkit-user-select:text!important;user-select:text!important}
input,textarea{-webkit-user-select:auto!important;user-select:auto!important}



/* iOS IME fix */
input,textarea{font-size:16px!important;-webkit-user-select:text!important;user-select:text!important}

/* iOS Safari <15.4 dvh fallback */
@supports not (height:100dvh){
body,.app{min-height:100vh}
.lp{min-height:100vh}
}

/* Page content fill */
.page.active > .lp,.page.active > .hh,.page.active > .ps,.page.active > .pds{flex:1}
.colc{flex-shrink:0}

/* Utility classes */
.mt10{margin-top:10px}.mt8{margin-top:8px}
.text-muted{font-size:11px;color:#999}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top-bar" id="topBar"><button class="back-btn" id="backBtn">‹</button><div class="top-title" id="topTitle">返回</div></div>
  <div class="page active" id="pageLogin">
    <div class="lp">
      <div class="pb-icon"></div>
      <div class="lt">精灵<span>世界</span></div>
      <div class="ls">Pet · Battle · Grow</div>
      <div class="lpets" id="loginPets"></div>
      <div class="pkm-frame">
        <textarea id="loginName" placeholder="训练家名称" rows="1" style="-webkit-user-select:text!important;user-select:text!important;font-size:16px;resize:none;overflow:hidden;padding:10px 12px;border:2px solid #CCC;border-radius:8px;background:#F8F8F8;color:var(--pkdark);font-family:var(--font);outline:none;text-align:center;width:100%;box-sizing:border-box"></textarea>
        <input id="loginPwd" placeholder="密码" type="password" style="-webkit-user-select:text!important;user-select:text!important;font-size:16px">
        <button class="pk-btn" id="loginBtn">⚡ 进入精灵世界</button>
        <div class="lerr" id="loginError"></div>
        <div class="lh">新训练家请联系老师获取账号密码</div>
      </div>
    </div>
  </div>

      st.people[n]=apiData.people[n];

      changed=true;
    }else{
      var localTS=st.people[n].lastTimestamp||0;
      var apiTS=apiData.people[n].lastTimestamp||0;
      if(apiTS>localTS){
        st.people[n]=apiData.people[n];

function swPet(si){var n=st.tn,p=st.people[n];if(!p)return;var sl=p.petSlots[si],lv=p.petLevels[si],xp=p.petXP[si],nd=xfl(lv),pct=Math.min(100,xp/nd*100),mx=lv>=100,sk=cs(p);var gif=document.getElementById("homePetGif");if(gif)gif.src="/images/pets/pet_"+String(sl+1).padStart(2,"0")+"_"+(window._pf||"walk")+".gif";var pn=document.querySelector(".pn");if(pn)pn.textContent="🐾 精灵 #"+(sl+1);var pt=document.querySelector(".pt .badge");if(pt)pt.textContent="Lv."+lv+(mx?" 🏆":"");var eb=document.querySelector(".eb .pf");if(eb)eb.style.width=pct+"%";var et=document.querySelector(".eb .et");if(et)et.textContent=mx?"🏆 已满级！":"EXP "+(nd-xp)+" 到下一级";var bis=document.querySelectorAll(".bi");if(bis.length>=2){var b1=bis[0].querySelector(".pf");if(b1){b1.style.width=sk.hunger+"%";b1.style.background=sk.hunger>60?"#32CD32":sk.hunger>30?"#FFA500":"#FF4500"}var bv1=bis[0].querySelector(".bv");if(bv1)bv1.textContent=sk.hunger+"%";var b2=bis[1].querySelector(".pf");if(b2){b2.style.width=sk.happiness+"%";b2.style.background=sk.happiness>60?"#32CD32":sk.happiness>30?"#FFA500":"#FF4500"}var bv2=bis[1].querySelector(".bv");if(bv2)bv2.textContent=sk.happiness+"%"}document.querySelectorAll(".pli").forEach(function(e,i){e.classList.toggle("cur",i===si);if(i===si){var b=e.querySelector(".pb");if(!b){b=document.createElement("span");b.className="pb";b.textContent="✔";e.appendChild(b)}}else{var b2=e.querySelector(".pb");if(b2)b2.remove()}});resetWalk()}

// Drag-to-scroll for pet list
function setupDragScroll() {
  document.querySelectorAll(".scroll-x").forEach(function(el) {
    var isDown = false, startX, startY, scrollLeft, moved = false;
    el.addEventListener("mousedown", function(e) {
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
      isDown = true; moved = false;
      startX = e.pageX - el.offsetLeft; startY = e.pageY;
      scrollLeft = el.scrollLeft;
      el.style.cursor = "grabbing";
    });
    el.addEventListener("mouseleave", function() { isDown = false; el.style.cursor = ""; });
    document.addEventListener("mouseup", function() { isDown = false; el.style.cursor = ""; });
    el.addEventListener("mousemove", function(e) {
      if(!isDown) return;
      var x = e.pageX - el.offsetLeft, dx = x - startX;
      if(Math.abs(dx) > 5 || Math.abs(e.pageY - startY) > 5) moved = true;
      if(moved) { e.preventDefault(); el.scrollLeft = scrollLeft - dx; }
    });
    // Prevent click after drag
    el.addEventListener("click", function(e) { if(moved) { e.stopPropagation(); } }, true);
  });
}
