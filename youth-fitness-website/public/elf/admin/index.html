<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>打卡小精灵 - 管理端</title>
<link rel="stylesheet" href="/elf/admin/admin.css?v=20260630">
</head>
<body>
<div class="app" id="app">
  <div class="top-bar" id="topBar"><button class="back-btn" id="backBtn">‹</button><div class="top-title" id="topTitle">返回</div></div>
  <div class="page active" id="pageHome">
    <div class="page-header"><span class="page-title">👥 人员管理</span>
      <div class="header-actions">
        <button class="btn-icon btn-icon-sm" id="exportBtn" title="导出数据">📥</button>
        <button class="btn-icon" id="addBtn">＋</button>
      </div>
    </div>
    <div class="batch-toolbar" id="batchToolbar">
      <label class="batch-cb"><input type="checkbox" id="selectAll"> 全选</label>
      <button class="btn-gold btn-xs" id="batchPoints">⭐ +10</button>
      <button class="btn-gold btn-xs" id="batchCheckin">📅 +1</button>
      <span class="batch-count" id="batchCount"></span>
    </div>
    <div class="person-grid" id="personGrid"></div>
  </div>
  <div class="page" id="pagePerson"><div id="personContent"></div></div>
  <div class="page" id="pageStats"><div id="statsContent"></div></div>
  <div class="nav show" id="nav">
    <button class="nav-item active" data-pg="pageHome"><span class="ni">👥</span>人员</button>
    <button class="nav-item" data-pg="pageStats"><span class="ni">📊</span>统计</button>
  </div>
</div>
<div class="modal-overlay" id="modalAdd">
  <div class="modal-card">
    <div class="modal-title">➕ 添加训练家</div>
    <div class="modal-desc">为学生创建一个游戏账号</div>
    <input class="input-field input-field-gap" id="addName" placeholder="学生姓名">
    <input class="input-field input-field-gap-lg" id="addPwd" placeholder="初始密码" type="password">
    <div class="modal-actions"><button class="btn-gold" id="addConfirm">✅ 确认</button><button class="btn-danger" id="addCancel">取消</button></div>
  </div>
</div>
<div class="modal-overlay" id="modalPwd">
  <div class="modal-card">
    <div class="modal-title">🔑 设置密码</div>
    <div class="modal-desc" id="modalPwdName">设置密码</div>
    <input class="input-field input-field-gap-lg" id="pwdInput" placeholder="新密码" type="password">
    <div class="modal-actions"><button class="btn-gold" id="pwdConfirm">✅ 确认</button><button class="btn-danger" id="pwdCancel">取消</button></div>
  </div>
</div>
<div class="modal-overlay" id="modalBox"><div class="modal-card" id="boxContent"></div></div>
<div class="toast" id="toast"></div>
<script src="/elf/admin/admin.js?v=20260630"></script>
</body>
</html>
