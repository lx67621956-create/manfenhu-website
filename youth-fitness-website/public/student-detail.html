<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学员详情 - 满分虎</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DD 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #FF6B35;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 16px;
      transition: all 0.3s;
    }
    .back-btn:hover {
      transform: translateX(-4px);
    }
    .profile-card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.08);
      margin-bottom: 24px;
    }
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .profile-info h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 12px;
    }
    .profile-tags {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    .tag {
      background: #FFF5F0;
      padding: 6px 16px;
      border-radius: 16px;
      color: #FF6B35;
      font-size: 14px;
      font-weight: 500;
    }
    .profile-meta {
      font-size: 14px;
      color: #999;
      margin-top: 8px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #FF6B35;
      color: white;
    }
    .btn-primary:hover {
      background: #E55A2B;
      transform: translateY(-2px);
    }
    .btn-danger {
      background: white;
      color: #ff4444;
      border: 2px solid #ff4444;
    }
    .btn-danger:hover {
      background: #ff4444;
      color: white;
    }
    .section {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.08);
      margin-bottom: 24px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .record-item {
      padding: 20px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      transition: all 0.3s;
    }
    .record-item:hover {
      border-color: #FF6B35;
      background: #FFFAF8;
    }
    .record-delete-btn {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: all 0.2s;
    }
    .record-delete-btn:hover {
      color: #E0533D;
      background: #FBE9E4;
    }
    .record-makeup-btn {
      background: #FFF3E8;
      border: 1px solid #FFD9BE;
      color: #C2410C;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px 11px;
      border-radius: 8px;
      line-height: 1.4;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .record-makeup-btn:hover {
      background: #FFE6D2;
      border-color: #FF6B35;
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .record-date {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    .record-score {
      font-size: 24px;
      font-weight: 700;
      color: #FF6B35;
    }
    .record-level {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      margin-left: 8px;
    }
    .level-优秀 { background: #E8F5E9; color: #2E7D32; }
    .level-良好 { background: #E3F2FD; color: #1565C0; }
    .level-及格 { background: #FFF3E0; color: #E65100; }
    .level-不及格 { background: #FFEBEE; color: #C62828; }
    .level-待提升 { background: #FFEBEE; color: #C62828; }
    .record-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
    .detail-item {
      font-size: 14px;
      color: #666;
    }
    .detail-item strong {
      color: #333;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    /* 移动端优化 */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .container {
        max-width: 100%;
      }
      .profile-card {
        padding: 20px;
      }
      .profile-header {
        flex-direction: column;
        gap: 16px;
      }
      .profile-info h1 {
        font-size: 24px;
      }
      .btn-group {
        width: 100%;
      }
      .btn-group .btn {
        flex: 1;
      }
      .section {
        padding: 16px;
      }
      .section-title {
        font-size: 18px;
      }
      .record-item {
        padding: 16px;
      }
      .record-score {
        font-size: 20px;
      }
      .record-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/students.html" class="back-btn">
      ← 返回学员列表
    </a>

    <div id="profileSection" class="loading">加载中...</div>

    <!-- 身高体重 -->
    <div class="section" id="bodySection" style="display: none;">
      <div class="section-header">
        <h2 class="section-title">身高体重</h2>
        <button class="btn btn-primary" onclick="openBodyModal()">+ 记录身高体重</button>
      </div>
      <div id="bodySummary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px;"></div>
      <div id="bodyChartWrap" style="display: none; background: linear-gradient(160deg, #FFF7F1 0%, #FFEDE0 100%); padding: 20px 20px 14px; border-radius: 16px; box-shadow: 0 6px 18px rgba(240, 78, 35, 0.08); border: 1px solid #FBE3D0;">
        <canvas id="bodyChart" style="max-height: 260px;"></canvas>
      </div>
      <div id="bodyHistory" style="margin-top: 16px;"></div>
    </div>

    <!-- 身高体重录入弹窗 -->
    <div id="bodyModal" style="display: none; position: fixed; inset: 0; background: rgba(43,39,36,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
      <div style="background: #fff; border-radius: 16px; padding: 22px; max-width: 360px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.25);">
        <h3 style="margin: 0 0 16px; font-size: 17px; color: #4A3F35;">记录身高体重</h3>
        <label style="display: block; font-size: 13px; color: #8A7B6E; margin-bottom: 6px;">日期</label>
        <input type="date" id="bodyDate" style="width: 100%; padding: 10px; border: 1px solid #F0E4D8; border-radius: 10px; font-size: 14px; margin-bottom: 14px; box-sizing: border-box; font-family: inherit;">
        <label style="display: block; font-size: 13px; color: #8A7B6E; margin-bottom: 6px;">身高（cm）</label>
        <input type="number" step="0.1" min="50" max="250" id="bodyHeight" placeholder="如 157" style="width: 100%; padding: 10px; border: 1px solid #F0E4D8; border-radius: 10px; font-size: 14px; margin-bottom: 14px; box-sizing: border-box; font-family: inherit;">
        <label style="display: block; font-size: 13px; color: #8A7B6E; margin-bottom: 6px;">体重（kg）</label>
        <input type="number" step="0.1" min="10" max="200" id="bodyWeight" placeholder="如 53.5" style="width: 100%; padding: 10px; border: 1px solid #F0E4D8; border-radius: 10px; font-size: 14px; margin-bottom: 14px; box-sizing: border-box; font-family: inherit;">
        <div id="bodyModalTip" style="font-size: 12px; color: #B0A093; line-height: 1.6; margin-bottom: 4px;">同一天重复记录会覆盖旧值；在测评工具里填了身高体重也会自动记到这里。</div>
        <div style="display: flex; gap: 10px; margin-top: 14px;">
          <button class="btn btn-primary" style="flex: 1;" onclick="saveBodyRecord()">保存</button>
          <button class="btn" style="flex: 1; background: #F5EFE8; color: #8A7B6E;" onclick="closeBodyModal()">取消</button>
        </div>
      </div>
    </div>

    <!-- 数据统计 -->
    <div class="section" id="statsSection" style="display: none;">
      <h2 class="section-title">数据统计</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        <div style="background: linear-gradient(160deg, #FFF7F1 0%, #FFEDE0 100%); padding: 20px 20px 14px; border-radius: 16px; box-shadow: 0 6px 18px rgba(240, 78, 35, 0.08); border: 1px solid #FBE3D0;">
          <canvas id="trendChart" style="max-height: 250px;"></canvas>
        </div>
        <div style="background: linear-gradient(160deg, #FFF7F1 0%, #FFEDE0 100%); padding: 20px 20px 14px; border-radius: 16px; box-shadow: 0 6px 18px rgba(240, 78, 35, 0.08); border: 1px solid #FBE3D0;">
          <canvas id="dimensionChart" style="max-height: 250px;"></canvas>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2 class="section-title">测评记录</h2>
        <button class="btn btn-primary" onclick="addRecord()">+ 新增测评</button>
      </div>
      <div id="recordsList" class="records-list">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    const API = '/api/data';
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    let currentStudent = null;

    // roundRect 兼容垫片（旧浏览器无 CanvasRenderingContext2D.roundRect）
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        else r = r || {};
        const tl = r.tl || 0, tr = r.tr || 0, br = r.br || 0, bl = r.bl || 0;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        return this;
      };
    }

    if (!studentId) {
      alert('缺少学员ID');
      window.location.href = '/students.html';
    }

    // 加载学员详情
    async function loadStudent() {
      try {
        const res = await fetch(API + `?students=get&id=${studentId}`);
        const data = await res.json();
        if (!data.ok) {
          alert('学员不存在');
          window.location.href = '/students.html';
          return;
        }
        currentStudent = data.student;
        renderProfile(currentStudent);
        renderBodySection(currentStudent);
        renderRecords(currentStudent.records || []);
      } catch (e) {
        document.getElementById('profileSection').innerHTML = '<div class="empty-state">加载失败</div>';
      }
    }

    // 渲染学员信息
    function renderProfile(student) {
      const genderText = student.gender === 'M' ? '男' : '女';
      const createdDate = new Date(student.createdAt).toLocaleDateString('zh-CN');
      const bl = bodyList(student);
      const latestBody = bl[bl.length - 1];
      const bodyTags = latestBody
        ? `<span class="tag">${latestBody.height} cm</span><span class="tag">${latestBody.weight} kg</span>`
        : '';

      document.getElementById('profileSection').innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-info">
              <h1>${student.name}</h1>
              <div class="profile-tags">
                <span class="tag">${genderText}</span>
                <span class="tag">${student.currentGrade}年级</span>
                <span class="tag">测评 ${student.records.length} 次</span>
                ${bodyTags}
              </div>
              <div class="profile-meta">
                学员ID: ${student.studentId} | 创建时间: ${createdDate}
              </div>
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" onclick="exportStudent()">导出报告</button>
              <button class="btn btn-danger" onclick="deleteStudent()">删除学员</button>
            </div>
          </div>
        </div>
      `;
    }

    /* ========== 身高体重（基础信息 + 独立曲线） ========== */
    let bodyChartInstance = null;

    function bodyList(student) {
      const map = {};
      /* 1) 身高体重档案（手动记录 + 新测评同步） */
      (student.bodyRecords || []).forEach(b => {
        if (Number(b.height) > 0 && Number(b.weight) > 0) map[b.date] = { ...b, height: Number(b.height), weight: Number(b.weight) };
      });
      /* 2) 历史测评记录里的身高体重（老数据兜底：bmiInfo 或 items[].sub "157cm/53.5kg"） */
      (student.records || []).forEach(r => {
        if (!r.date || map[r.date]) return;
        let h = null, w = null;
        if (r.bmiInfo && Number(r.bmiInfo.height) > 0 && Number(r.bmiInfo.weight) > 0) {
          h = Number(r.bmiInfo.height); w = Number(r.bmiInfo.weight);
        } else {
          const bmiIt = (r.items || []).filter(it => it.key === 'bmi')[0];
          if (bmiIt && bmiIt.sub) {
            const m = String(bmiIt.sub).match(/([\d.]+)\s*cm\s*\/\s*([\d.]+)\s*kg/);
            if (m) { h = parseFloat(m[1]); w = parseFloat(m[2]); }
          }
        }
        if (h > 0 && w > 0) map[r.date] = { date: r.date, height: h, weight: w, source: 'assessment' };
      });
      return Object.values(map).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    }

    function renderBodySection(student) {
      const section = document.getElementById('bodySection');
      const summary = document.getElementById('bodySummary');
      const wrap = document.getElementById('bodyChartWrap');
      const hist = document.getElementById('bodyHistory');
      section.style.display = 'block';

      const list = bodyList(student);
      if (!list.length) {
        summary.innerHTML = '';
        wrap.style.display = 'none';
        hist.innerHTML = '<div class="empty-state"><p>暂无身高体重记录</p>' +
          '<p style="font-size:12px;margin-top:8px;">点「+ 记录身高体重」开始；测评工具里填了身高体重也会自动记入</p></div>';
        return;
      }

      const first = list[0], last = list[list.length - 1];
      const dH = Math.round((last.height - first.height) * 10) / 10;
      const dW = Math.round((last.weight - first.weight) * 10) / 10;
      const bmi = last.weight / Math.pow(last.height / 100, 2);
      const sig = v => (v > 0 ? '+' : '') + v;
      const card = (label, value, unit, sub, color) => `
        <div style="background:#fff;border:1px solid #F0E4D8;border-radius:12px;padding:14px;">
          <div style="font-size:12px;color:#B0A093;margin-bottom:6px;">${label}</div>
          <div style="font-size:22px;font-weight:800;color:${color};">${value}<span style="font-size:12px;font-weight:600;color:#B0A093;"> ${unit}</span></div>
          <div style="font-size:12px;color:#8A7B6E;margin-top:4px;">${sub}</div>
        </div>`;

      summary.innerHTML =
        card('当前身高', last.height, 'cm', list.length > 1 ? `较首次 ${sig(dH)} cm` : '首次记录', '#FF6B35') +
        card('当前体重', last.weight, 'kg', list.length > 1 ? `较首次 ${sig(dW)} kg` : '首次记录', '#2E9E6B') +
        card('当前 BMI', bmi.toFixed(1), '', '体重(kg) ÷ 身高(m)²', '#5B7FBF') +
        card('记录次数', list.length + ' 次', '', `${first.date.slice(5)} ~ ${last.date.slice(5)}`, '#8A7B6E');

      /* 曲线：身高(左轴) + 体重(右轴)，>=2 条记录才画 */
      if (list.length >= 2) {
        wrap.style.display = 'block';
        if (bodyChartInstance) bodyChartInstance.destroy();
        bodyChartInstance = new Chart(document.getElementById('bodyChart'), {
          type: 'line',
          data: {
            labels: list.map(b => b.date.slice(5)),
            datasets: [
              { label: '身高(cm)', data: list.map(b => b.height), borderColor: '#FF6B35', backgroundColor: 'rgba(255,107,53,0.12)', borderWidth: 3, tension: 0.35, fill: true, pointRadius: 5, pointHoverRadius: 7, yAxisID: 'y' },
              { label: '体重(kg)', data: list.map(b => b.weight), borderColor: '#2E9E6B', backgroundColor: 'rgba(46,158,107,0.10)', borderWidth: 3, tension: 0.35, fill: false, pointRadius: 5, pointHoverRadius: 7, yAxisID: 'y1' }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: true,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { position: 'bottom', labels: { font: { size: 12, family: "'PingFang SC','Microsoft YaHei',sans-serif" }, usePointStyle: true, boxWidth: 8 } },
              title: { display: true, text: '身高体重变化', font: { size: 15, weight: 'bold', family: "'PingFang SC','Microsoft YaHei',sans-serif" }, color: '#4A3F35', padding: { bottom: 8 } },
              tooltip: { backgroundColor: 'rgba(43,39,36,0.9)', titleFont: { size: 13 }, bodyFont: { size: 13 }, padding: 10, cornerRadius: 8 }
            },
            scales: {
              y:  { position: 'left',  title: { display: true, text: '身高 (cm)', color: '#FF6B35', font: { size: 12 } }, grid: { color: 'rgba(240,228,216,0.6)' }, ticks: { color: '#B0A093', font: { size: 11 } } },
              y1: { position: 'right', title: { display: true, text: '体重 (kg)', color: '#2E9E6B', font: { size: 12 } }, grid: { drawOnChartArea: false }, ticks: { color: '#B0A093', font: { size: 11 } } },
              x:  { grid: { display: false }, ticks: { color: '#B0A093', font: { size: 11 } } }
            }
          }
        });
      } else {
        wrap.style.display = 'none';
      }

      hist.innerHTML = '<div style="font-size:14px;font-weight:700;color:#4A3F35;margin-bottom:10px;">记录明细</div>' +
        list.slice().reverse().map(b => {
          const src = b.source === 'assessment' ? '<span style="font-size:11px;color:#B0A093;">（测评同步）</span>' : '';
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #F0E4D8;border-radius:10px;margin-bottom:8px;background:#fff;">
            <div style="font-size:13px;color:#4A3F35;"><strong>${b.date}</strong> ${src}</div>
            <div style="display:flex;align-items:center;gap:14px;">
              <span style="font-size:13px;color:#FF6B35;font-weight:700;">${b.height} cm</span>
              <span style="font-size:13px;color:#2E9E6B;font-weight:700;">${b.weight} kg</span>
              <button onclick="deleteBodyRecord('${b.date}')" style="background:transparent;border:none;color:#ccc;font-size:15px;cursor:pointer;padding:2px 6px;" title="删除">✕</button>
            </div>
          </div>`;
        }).join('');
    }

    function openBodyModal() {
      document.getElementById('bodyDate').value = new Date().toISOString().split('T')[0];
      const list = bodyList(currentStudent);
      const last = list[list.length - 1];
      document.getElementById('bodyHeight').value = last ? last.height : '';
      document.getElementById('bodyWeight').value = last ? last.weight : '';
      document.getElementById('bodyModal').style.display = 'flex';
    }
    function closeBodyModal() {
      document.getElementById('bodyModal').style.display = 'none';
    }

    async function saveBodyRecord() {
      const date = document.getElementById('bodyDate').value;
      const height = parseFloat(document.getElementById('bodyHeight').value);
      const weight = parseFloat(document.getElementById('bodyWeight').value);
      if (!date) { alert('请选择日期'); return; }
      if (!(height > 0) || !(weight > 0)) { alert('请填写身高和体重'); return; }
      try {
        const res = await fetch(API + '?students=bodyRecord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, date, height, weight })
        });
        const r = await res.json();
        if (!r.ok) { alert('保存失败: ' + (r.error || '未知错误')); return; }
        closeBodyModal();
        await loadStudent();
      } catch (e) {
        alert('网络错误，请重试');
      }
    }

    async function deleteBodyRecord(date) {
      if (!confirm(`确认删除 ${date} 的身高体重记录？`)) return;
      try {
        const res = await fetch(API + '?students=deleteBodyRecord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, date })
        });
        const r = await res.json();
        if (!r.ok) { alert('删除失败: ' + (r.error || '未知错误')); return; }
        await loadStudent();
      } catch (e) {
        alert('网络错误，请重试');
      }
    }

    // 渲染测评记录
    function renderRecords(records) {
      const container = document.getElementById('recordsList');
      if (records.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>暂无测评记录</p>
            <p style="font-size: 12px; margin-top: 8px;">点击「新增测评」开始记录</p>
          </div>
        `;
        return;
      }

      // 按日期倒序排列
      const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = sorted.map(r => {
        const levelClass = r.level ? `level-${r.level}` : '';
        const dimensions = r.dimensions || {};
        const items = r.items || [];
        
        // 单项得分展示
        let itemsHtml = '';
        if (items.length > 0) {
          itemsHtml = '<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0f0f0;"><strong style="color: #666; font-size: 14px;">单项得分：</strong><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 8px;">';
          items.forEach(item => {
            itemsHtml += `<div style="font-size: 13px; color: #666;"><span style="color: #FF6B35; font-weight: 700;">${item.score || 0}</span> 分 · ${item.name || item.key}</div>`;
          });
          itemsHtml += '</div></div>';
        }

        // 加分明细展示
        const bonusDetail = r.bonusDetail || [];
        let bonusHtml = '';
        if (bonusDetail.length > 0) {
          bonusHtml = '<div style="margin-top: 10px; padding: 10px 12px; background: #E6F4EB; border-radius: 8px;">'
            + '<div style="font-size: 12.5px; font-weight: 700; color: #2FA25B; margin-bottom: 6px;">🏅 附加分 +' + (r.bonus || 0) + ' 分（已计入总分）</div>';
          bonusDetail.forEach(d => {
            bonusHtml += `<div style="font-size: 12px; color: #4A7C59; line-height: 1.7;">· ${d.name} +${d.bonus} 分<span style="color:#8FA898;">（${d.ref || ''}）</span></div>`;
          });
          bonusHtml += '</div>';
        }
        
        return `
          <div class="record-item">
            <div class="record-header">
              <div>
                <span class="record-date">${r.date}</span>
                ${r.level ? `<span class="record-level ${levelClass}">${r.level}</span>` : ''}
                ${r.missing > 0 ? `<span style="display:inline-block;margin-left:6px;padding:2px 8px;border-radius:10px;background:#FFF3E8;color:#C2410C;font-size:11px;font-weight:700;" title="还有 ${r.missing} 个项目未测，可点击补录补齐">⚠ ${r.missing} 项未测</span>` : ''}
              </div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <div>
                  <span class="record-score">${r.total || '-'}</span>
                  ${r.max ? `<span style="color: #999; font-size: 14px;">/${r.max}</span>` : ''}
                </div>
                <button class="record-makeup-btn" onclick="makeupRecord('${r.recordId}', '${r.date}')" title="补录：填写剩余项目，日期不变">✏️ 补录</button>
                <button class="record-delete-btn" onclick="deleteRecord('${r.recordId}', '${r.date}')" title="删除这条记录">✕</button>
              </div>
            </div>
            <div class="record-details">
              ${r.grade ? `<div class="detail-item"><strong>年级:</strong> ${r.grade}</div>` : ''}
              ${r.mode ? `<div class="detail-item"><strong>模式:</strong> ${r.mode === 'guoti' ? '国体' : r.mode === 'xc' || r.mode === 'xianchang' ? '现场' : r.mode === 'manual' ? '手动' : r.mode}</div>` : ''}
              ${Object.keys(dimensions).length > 0 ? 
                Object.entries(dimensions).map(([k, v]) => 
                  `<div class="detail-item"><strong>${k}:</strong> ${v}</div>`
                ).join('') : ''}
            </div>
            ${itemsHtml}
            ${bonusHtml}
          </div>
        `;
      }).join('');

      // 渲染图表（记录数 >= 2 时显示）
      if (records.length >= 2) {
        renderCharts(records);
      }
    }

    // 渲染统计图表
    function renderCharts(records) {
      document.getElementById('statsSection').style.display = 'block';

      // 按日期正序排列用于图表
      const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));

      // 1. 总分趋势图（国体满分120 / 9年级现场满分30，统一按得分率百分比绘制）
      // 记录里存了 max（guoti→120、xc→30）；历史数据可能无 max，按模式回退
      function scoreMax(r) {
        if (r.max && r.max > 0) return r.max;
        if (r.mode === 'guoti') return 120;
        if (r.mode === 'xc') return 30;
        return 100; // 旧版手动计分按百分制
      }
      function scorePct(r) {
        const m = scoreMax(r);
        return m > 0 ? Math.round(Math.min(r.total, m) / m * 100) : 0;
      }
      const trendCtx = document.getElementById('trendChart');
      new Chart(trendCtx, {
        type: 'line',
        data: {
          labels: sorted.map(r => r.date),
          datasets: [{
            label: '得分率',
            data: sorted.map(scorePct),
            borderColor: '#FF6B35',
            backgroundColor: 'rgba(255, 107, 53, 0.1)',
            borderWidth: 3,
            tension: 0.4,
            fill: true,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: '总分趋势（得分率 %）',
              font: { size: 15, weight: 'bold', family: "'PingFang SC','Microsoft YaHei',sans-serif" },
              color: '#4A3F35',
              padding: { bottom: 8 }
            },
            tooltip: {
              backgroundColor: 'rgba(43,39,36,0.9)',
              padding: 10,
              callbacks: {
                label: function(ctx) {
                  const r = sorted[ctx.dataIndex];
                  const m = scoreMax(r);
                  const modeTxt = r.mode === 'xc' ? '现场' : (r.mode === 'guoti' ? '国体' : '手动');
                  return modeTxt + '：' + r.total + '/' + m + '分（得分率 ' + ctx.parsed.y + '%）';
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              ticks: {
                color: '#666',
                callback: function(v) { return v + '%'; }
              },
              grid: { color: 'rgba(0,0,0,0.05)' }
            },
            x: {
              ticks: { color: '#666' },
              grid: { display: false }
            }
          }
        }
      });

      // 2. 维度雷达图（如果有维度数据）
      const latestWithDimensions = sorted.reverse().find(r => r.dimensions && Object.keys(r.dimensions).length > 0);
      if (latestWithDimensions) {
        const dims = latestWithDimensions.dimensions;
        const dimCtx = document.getElementById('dimensionChart');
        const gCtx = dimCtx.getContext('2d');
        // 竖向渐变填充：中心品牌色 → 边缘淡出
        const fillGrad = gCtx.createLinearGradient(0, 0, 0, 260);
        fillGrad.addColorStop(0, 'rgba(255,107,53,0.38)');
        fillGrad.addColorStop(1, 'rgba(255,107,53,0.05)');
        // 数据标注插件：每个顶点上方显示分值
        const radarLabelsPlugin = {
          id: 'radarValueLabels',
          afterDatasetsDraw(chart) {
            const meta = chart.getDatasetMeta(0);
            const ds = chart.data.datasets[0];
            const ctx = chart.ctx;
            ctx.save();
            ctx.font = "bold 12px 'PingFang SC','Microsoft YaHei',sans-serif";
            meta.data.forEach((pt, i) => {
              const val = ds.data[i];
              if (val === undefined || val === null) return;
              ctx.fillStyle = 'rgba(255,255,255,0.95)';
              const tw = ctx.measureText(String(val)).width;
              ctx.beginPath();
              ctx.roundRect(pt.x - tw / 2 - 6, pt.y - 26, tw + 12, 18, 9);
              ctx.fill();
              ctx.fillStyle = '#FF6B35';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(val, pt.x, pt.y - 17);
            });
            ctx.restore();
          }
        };
        new Chart(dimCtx, {
          type: 'radar',
          data: {
            labels: Object.keys(dims),
            datasets: [{
              label: '最近测评',
              data: Object.values(dims),
              borderColor: '#FF6B35',
              backgroundColor: fillGrad,
              borderWidth: 2.5,
              borderJoinStyle: 'round',
              tension: 0.35,
              pointBackgroundColor: '#FF6B35',
              pointBorderColor: '#fff',
              pointBorderWidth: 2,
              pointRadius: 4.5,
              pointHoverRadius: 7,
              pointShadowColor: 'rgba(255,107,53,0.45)',
              pointShadowBlur: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { display: false },
              title: {
                display: true,
                text: '素质维度分析',
                color: '#4A3F35',
                font: { size: 15, weight: 700, family: "'PingFang SC','Microsoft YaHei',sans-serif" },
                padding: { bottom: 12 }
              },
              tooltip: {
                backgroundColor: 'rgba(43,39,36,0.9)',
                padding: 10,
                titleFont: { size: 13, weight: 'bold' },
                bodyFont: { size: 12.5 },
                callbacks: {
                  label: function(ctx) {
                    return ctx.dataset.label + '：' + ctx.parsed.r + ' 分';
                  }
                }
              }
            },
            scales: {
              r: {
                beginAtZero: true,
                max: 100,
                min: 0,
                ticks: { display: false, stepSize: 20 },
                grid: {
                  circular: true,
                  color: 'rgba(120,110,100,0.14)',
                  lineWidth: 1
                },
                angleLines: { color: 'rgba(120,110,100,0.10)' },
                pointLabels: {
                  color: '#4A3F35',
                  font: { size: 13, weight: 'bold', family: "'PingFang SC','Microsoft YaHei',sans-serif" },
                  padding: 6
                }
              }
            }
          },
          plugins: [radarLabelsPlugin]
        });
      }
    }

    // 新增测评
    function addRecord() {
      // 跳转到测评工具，携带学员信息
      const params = new URLSearchParams({
        studentId: studentId,
        name: currentStudent.name,
        gender: currentStudent.gender,
        grade: currentStudent.currentGrade
      });
      window.location.href = '/tools/assessment.html?' + params.toString();
    }

    // 删除单条测评记录
    async function deleteRecord(recordId, date) {
      if (!confirm(`确认删除 ${date} 的测评记录？\n\n删除后无法恢复。`)) {
        return;
      }

      try {
        const res = await fetch(API + '?students=deleteRecord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId: studentId, recordId: recordId })
        });
        const result = await res.json();
        if (result.ok) {
          // 本地同步更新，避免整页重载
          currentStudent.records = currentStudent.records.filter(r => r.recordId !== recordId);
          renderRecords(currentStudent.records);
          renderProfile(currentStudent);
        } else {
          alert('删除失败: ' + (result.error || '未知错误'));
        }
      } catch (e) {
        alert('网络错误，请重试');
      }
    }

    // 补录：跳转到测评工具并带入该记录（日期保持不变，仅补充/修改项目）
    function makeupRecord(recordId, date) {
      var url = '/tools/assessment.html?studentId=' + encodeURIComponent(studentId)
              + '&recordId=' + encodeURIComponent(recordId);
      window.location.href = url;
    }

    // 删除学员
    async function deleteStudent() {
      if (!confirm(`确认删除学员「${currentStudent.name}」？\n\n此操作将删除该学员的所有测评记录，且不可恢复。`)) {
        return;
      }

      try {
        const res = await fetch(API + '?students=delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId: studentId })
        });
        const result = await res.json();
        if (result.ok) {
          alert('删除成功');
          window.location.href = '/students.html';
        } else {
          alert('删除失败: ' + (result.error || '未知错误'));
        }
      } catch (e) {
        alert('网络错误，请重试');
      }
    }

    // 导出学员报告
    function exportStudent() {
      if (!currentStudent || currentStudent.records.length === 0) {
        alert('暂无测评记录，无法导出');
        return;
      }

      // 生成 CSV 格式数据
      let csv = '\uFEFF'; // BOM for Excel UTF-8
      csv += '学员姓名,性别,年级,测评日期,测评模式,总分,满分,等级\n';
      
      currentStudent.records.forEach(r => {
        const genderText = currentStudent.gender === 'M' ? '男' : '女';
        const modeText = r.mode === 'guoti' ? '国体' : r.mode === 'xc' || r.mode === 'xianchang' ? '现场' : r.mode === 'manual' ? '手动' : r.mode;
        csv += `${currentStudent.name},${genderText},${r.grade || currentStudent.currentGrade}年级,${r.date},${modeText},${r.total},${r.max || 100},${r.level || '-'}\n`;
        
        // 单项得分
        if (r.items && r.items.length > 0) {
          csv += ',,,单项得分:,项目,得分,权重,单位\n';
          r.items.forEach(item => {
            csv += `,,,,${item.name || item.key},${item.score || 0},${item.weight || '-'},${item.unit || '-'}\n`;
          });
        }

        // 加分明细
        if (r.bonusDetail && r.bonusDetail.length > 0) {
          csv += `,,,加分合计:,${r.bonus || 0}分,标准分:,${r.stdScore || '-'}\n`;
          r.bonusDetail.forEach(d => {
            csv += `,,,,${d.name},+${d.bonus}分,${d.ref || ''},\n`;
          });
        }
        csv += '\n';
      });

      // 下载文件
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `${currentStudent.name}_测评报告_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 页面加载
    loadStudent();
  </script>
</body>
</html>
