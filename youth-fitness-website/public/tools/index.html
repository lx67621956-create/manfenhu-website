<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>满分虎教练工具箱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DD 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.1);
    }
    
    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #FF6B35;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 16px;
      color: #666;
    }
    
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .tool-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.2);
      border-color: #FF6B35;
    }
    
    .tool-icon {
      font-size: 36px;
      margin-bottom: 4px;
    }
    
    .tool-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    
    .tool-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    
    .tool-badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #FFF5F0;
      color: #FF6B35;
      font-weight: 500;
      align-self: flex-start;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin: 40px 0 20px;
      padding-left: 12px;
      border-left: 4px solid #FF6B35;
    }
    
    .footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #999;
      font-size: 14px;
    }
    
    @media (max-width: 600px) {
      .tools-grid {
        grid-template-columns: 1fr;
      }
      
      .header {
        padding: 20px 15px;
      }
      
      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🐯 满分虎教练工具箱</div>
      <div class="subtitle">专注青少年体质提升 · 一站式教学管理工具</div>
    </div>
    
    <div class="section-title">📊 学员管理</div>
    <div class="tools-grid">
      <a href="/students.html" class="tool-card">
        <div class="tool-icon">👥</div>
        <div>
          <div class="tool-title">学员档案</div>
          <div class="tool-desc">管理学员信息、查看训练记录、追踪成绩进步</div>
        </div>
      </a>
      
      <a href="/tools/assessment.html" class="tool-card">
        <div class="tool-icon">📈</div>
        <div>
          <div class="tool-title">成绩测评</div>
          <div class="tool-desc">国体测评、现场考试评分、自动生成雷达图</div>
        </div>
        <span class="tool-badge">含7维度分析</span>
      </a>
    </div>
    
    <div class="section-title">💬 家长沟通</div>
    <div class="tools-grid">
      <a href="/tools/summary.html" class="tool-card">
        <div class="tool-icon">📝</div>
        <div>
          <div class="tool-title">课后总结</div>
          <div class="tool-desc">一键生成个性化课后反馈，28项×10档表现描述</div>
        </div>
        <span class="tool-badge">智能生成</span>
      </a>
      
      <a href="/tools/group.html" class="tool-card">
        <div class="tool-icon">🎨</div>
        <div>
          <div class="tool-title">群话术海报</div>
          <div class="tool-desc">节气节日问候、天气提醒、品牌句，一键生成海报</div>
        </div>
        <span class="tool-badge">班主任必备</span>
      </a>
    </div>
    
    <div class="footer">
      满分虎 © 2026 · 专注青少年体质提升
    </div>
  </div>
</body>
</html>
