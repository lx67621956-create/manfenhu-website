<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学员档案管理 - 满分虎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DD 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.08);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      color: #FF6B35;
      font-size: 28px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: nowrap;
    }
    .header-tool-link {
      color: #FF6B35;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-header {
      white-space: nowrap;
    }
    .btn-primary {
      background: #FF6B35;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background: #E55A2B;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .student-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.3s;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .student-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.15);
      border-color: #FF6B35;
    }
    .student-name {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .student-info {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #666;
    }
    .student-info .tag {
      background: #FFF5F0;
      padding: 4px 12px;
      border-radius: 12px;
      color: #FF6B35;
    }
    .student-stats {
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      font-size: 14px;
      color: #999;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.3;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 32px;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .modal-title {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #666;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #FF6B35;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-secondary {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-secondary:hover {
      background: #f5f5f5;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    /* 筛选栏 */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-search {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
    }
    .filter-search:focus {
      border-color: #FF6B35;
    }
    .filter-select {
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      cursor: pointer;
      outline: none;
      transition: border-color 0.3s;
    }
    .filter-select:focus {
      border-color: #FF6B35;
    }
    .filter-count {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
      min-height: 18px;
    }
    /* 移动端优化 */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .header {
        padding: 16px;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
      }
      .header h1 {
        font-size: 22px;
      }
      .header-actions {
        gap: 8px;
      }
      .header-tool-link {
        font-size: 13px;
      }
      .btn-header {
        flex: 1;
        padding: 10px 4px;
        font-size: 13px;
        text-align: center;
      }
      .filter-search {
        flex: 1 1 100%;
        min-width: 0;
      }
      .filter-select {
        flex: 1 1 calc(50% - 5px);
        min-width: 0;
      }
      .student-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .modal-content {
        padding: 24px;
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>学员档案管理</h1>
      <div class="header-actions">
        <a href="/tools/" class="header-tool-link">🏠 工具箱</a>
        <button class="btn-primary btn-header" onclick="exportAllStudents()" style="background: #2FA25B;">批量导出</button>
        <button class="btn-primary btn-header" onclick="openCreateModal()">+ 新增学员</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" class="filter-search" placeholder="🔍 搜索姓名" oninput="applyFilters()">
      <select id="filterGrade" class="filter-select" onchange="applyFilters()">
        <option value="">全部年级</option>
        <option value="4">四年级</option>
        <option value="5">五年级</option>
        <option value="6">六年级</option>
        <option value="7">七年级</option>
        <option value="8">八年级</option>
        <option value="9">九年级</option>
      </select>
      <select id="filterGender" class="filter-select" onchange="applyFilters()">
        <option value="">全部性别</option>
        <option value="M">男</option>
        <option value="F">女</option>
      </select>
      <select id="sortBy" class="filter-select" onchange="applyFilters()">
        <option value="recent">最近测评优先</option>
        <option value="grade">按年级</option>
        <option value="name">按姓名</option>
        <option value="records">按记录数</option>
      </select>
    </div>

    <div id="filterCount" class="filter-count"></div>

    <div id="studentList" class="student-grid">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 新增学员弹窗 -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <h2 class="modal-title">新增学员</h2>
      <form id="createForm">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" name="name" required placeholder="请输入学员姓名">
        </div>
        <div class="form-group">
          <label>性别 *</label>
          <select name="gender" required>
            <option value="">请选择</option>
            <option value="M">男</option>
            <option value="F">女</option>
          </select>
        </div>
        <div class="form-group">
          <label>当前年级 *</label>
          <select name="currentGrade" required>
            <option value="">请选择</option>
            <option value="4">四年级</option>
            <option value="5">五年级</option>
            <option value="6">六年级</option>
            <option value="7">七年级</option>
            <option value="8">八年级</option>
            <option value="9">九年级</option>
          </select>
        </div>
        <div class="form-group" style="display: flex; gap: 12px;">
          <div style="flex: 1;">
            <label>身高（cm，选填）</label>
            <input type="number" step="0.1" min="50" max="250" name="height" placeholder="如 157">
          </div>
          <div style="flex: 1;">
            <label>体重（kg，选填）</label>
            <input type="number" step="0.1" min="10" max="200" name="weight" placeholder="如 53.5">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeCreateModal()">取消</button>
          <button type="submit" class="btn-primary" style="flex: 1;">确认新增</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = '/api/data';
    let studentsList = [];

    // 加载学员列表
    async function loadStudents() {
      try {
        const res = await fetch(API + '?students=list');
        const data = await res.json();
        studentsList = data.students || [];
        applyFilters();
      } catch (e) {
        document.getElementById('studentList').innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
      }
    }

    // 筛选 + 排序 + 渲染
    function applyFilters() {
      const keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const grade = document.getElementById('filterGrade').value;
      const gender = document.getElementById('filterGender').value;
      const sortBy = document.getElementById('sortBy').value;

      let list = studentsList.filter(s => {
        if (keyword && !s.name.toLowerCase().includes(keyword)) return false;
        if (grade && String(s.currentGrade) !== grade) return false;
        if (gender && s.gender !== gender) return false;
        return true;
      });

      if (sortBy === 'recent') {
        list.sort((a, b) => (b.lastRecordDate || '').localeCompare(a.lastRecordDate || ''));
      } else if (sortBy === 'grade') {
        list.sort((a, b) => (a.currentGrade || 0) - (b.currentGrade || 0) || a.name.localeCompare(b.name, 'zh'));
      } else if (sortBy === 'name') {
        list.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
      } else if (sortBy === 'records') {
        list.sort((a, b) => (b.recordCount || 0) - (a.recordCount || 0));
      }

      // 计数提示
      const countEl = document.getElementById('filterCount');
      const total = studentsList.length;
      if (keyword || grade || gender) {
        countEl.textContent = `筛选出 ${list.length} / ${total} 名学员`;
      } else {
        countEl.textContent = total > 0 ? `共 ${total} 名学员` : '';
      }

      renderStudents(list);
    }

    // 渲染学员列表
    function renderStudents(students) {
      const container = document.getElementById('studentList');
      if (students.length === 0) {
        const keyword = (document.getElementById('searchInput').value || '').trim();
        const grade = document.getElementById('filterGrade').value;
        const gender = document.getElementById('filterGender').value;
        const isFiltered = keyword || grade || gender;
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <p>${isFiltered ? '没有符合条件的学员' : '暂无学员档案'}</p>
            <p style="font-size: 12px; margin-top: 8px;">${isFiltered ? '试试调整筛选条件' : '点击右上角「新增学员」开始创建'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = students.map(s => `
        <div class="student-card" onclick="viewStudent('${s.studentId}')">
          <div class="student-name">${s.name}</div>
          <div class="student-info">
            <span class="tag">${s.gender === 'M' ? '男' : '女'}</span>
            <span class="tag">${s.currentGrade}年级</span>
            ${(s.height > 0 && s.weight > 0) ? `<span class="tag">${s.height}cm / ${s.weight}kg</span>` : ''}
          </div>
          <div class="student-stats">
            <span>测评记录: ${s.recordCount || 0}次</span>
            <span>${s.lastRecordDate || '暂无记录'}</span>
          </div>
        </div>
      `).join('');
    }

    // 打开新增弹窗
    function openCreateModal() {
      document.getElementById('createModal').classList.add('active');
    }

    // 关闭新增弹窗
    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('active');
      document.getElementById('createForm').reset();
    }

    // 提交新增
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        name: formData.get('name'),
        gender: formData.get('gender'),
        currentGrade: formData.get('currentGrade')
      };
      /* 身高体重选填（用于成长曲线：长高/减重追踪）*/
      const h = parseFloat(formData.get('height'));
      const w = parseFloat(formData.get('weight'));
      if (h > 0 && w > 0) { data.height = h; data.weight = w; }

      try {
        const res = await fetch(API + '?students=create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.ok) {
          closeCreateModal();
          loadStudents();
        } else {
          alert('创建失败: ' + (result.error || '未知错误'));
        }
      } catch (e) {
        alert('网络错误，请重试');
      }
    });

    // 查看学员详情
    function viewStudent(id) {
      window.location.href = '/student-detail.html?id=' + id;
    }

    // 批量导出所有学员
    async function exportAllStudents() {
      if (studentsList.length === 0) {
        alert('暂无学员数据');
        return;
      }

      // 获取所有学员的完整数据
      const allData = [];
      for (const s of studentsList) {
        try {
          const res = await fetch(API + `?students=get&id=${s.studentId}`);
          const data = await res.json();
          if (data.ok) {
            allData.push(data.student);
          }
        } catch (e) {
          console.error('获取学员数据失败:', s.studentId, e);
        }
      }

      // 生成 CSV
      let csv = '\uFEFF'; // BOM for Excel UTF-8
      csv += '学员ID,学员姓名,性别,当前年级,创建时间,测评次数,最近测评日期,最近总分,最近等级\n';
      
      allData.forEach(student => {
        const genderText = student.gender === 'M' ? '男' : '女';
        const createdDate = new Date(student.createdAt).toLocaleDateString('zh-CN');
        const recordCount = student.records.length;
        const latestRecord = student.records[student.records.length - 1];
        const latestDate = latestRecord ? latestRecord.date : '-';
        const latestScore = latestRecord ? latestRecord.total : '-';
        const latestLevel = latestRecord ? latestRecord.level : '-';
        
        csv += `${student.studentId},${student.name},${genderText},${student.currentGrade}年级,${createdDate},${recordCount},${latestDate},${latestScore},${latestLevel}\n`;
      });

      // 下载
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `学员档案汇总_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      alert(`已导出 ${allData.length} 名学员数据`);
    }

    // 页面加载
    loadStudents();
  </script>
</body>
</html>
