<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学员档案管理 - 满分虎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DD 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.08);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      color: #FF6B35;
      font-size: 28px;
      font-weight: 600;
    }
    .btn-primary {
      background: #FF6B35;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background: #E55A2B;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .student-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.3s;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .student-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.15);
      border-color: #FF6B35;
    }
    .student-name {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .student-info {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #666;
    }
    .student-info .tag {
      background: #FFF5F0;
      padding: 4px 12px;
      border-radius: 12px;
      color: #FF6B35;
    }
    .student-stats {
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      font-size: 14px;
      color: #999;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.3;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 32px;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .modal-title {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #666;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #FF6B35;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-secondary {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-secondary:hover {
      background: #f5f5f5;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>学员档案管理</h1>
      <button class="btn-primary" onclick="openCreateModal()">+ 新增学员</button>
    </div>

    <div id="studentList" class="student-grid">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 新增学员弹窗 -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <h2 class="modal-title">新增学员</h2>
      <form id="createForm">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" name="name" required placeholder="请输入学员姓名">
        </div>
        <div class="form-group">
          <label>性别 *</label>
          <select name="gender" required>
            <option value="">请选择</option>
            <option value="M">男</option>
            <option value="F">女</option>
          </select>
        </div>
        <div class="form-group">
          <label>当前年级 *</label>
          <select name="currentGrade" required>
            <option value="">请选择</option>
            <option value="4">四年级</option>
            <option value="5">五年级</option>
            <option value="6">六年级</option>
            <option value="7">七年级</option>
            <option value="8">八年级</option>
            <option value="9">九年级</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeCreateModal()">取消</button>
          <button type="submit" class="btn-primary" style="flex: 1;">确认新增</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = '/api/data';

    // 加载学员列表
    async function loadStudents() {
      try {
        const res = await fetch(API + '?students=list');
        const data = await res.json();
        renderStudents(data.students || []);
      } catch (e) {
        document.getElementById('studentList').innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
      }
    }

    // 渲染学员列表
    function renderStudents(students) {
      const container = document.getElementById('studentList');
      if (students.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <p>暂无学员档案</p>
            <p style="font-size: 12px; margin-top: 8px;">点击右上角「新增学员」开始创建</p>
          </div>
        `;
        return;
      }

      container.innerHTML = students.map(s => `
        <div class="student-card" onclick="viewStudent('${s.studentId}')">
          <div class="student-name">${s.name}</div>
          <div class="student-info">
            <span class="tag">${s.gender === 'M' ? '男' : '女'}</span>
            <span class="tag">${s.currentGrade}年级</span>
          </div>
          <div class="student-stats">
            <span>测评记录: ${s.recordCount || 0}次</span>
            <span>${s.lastRecordDate || '暂无记录'}</span>
          </div>
        </div>
      `).join('');
    }

    // 打开新增弹窗
    function openCreateModal() {
      document.getElementById('createModal').classList.add('active');
    }

    // 关闭新增弹窗
    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('active');
      document.getElementById('createForm').reset();
    }

    // 提交新增
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        name: formData.get('name'),
        gender: formData.get('gender'),
        currentGrade: formData.get('currentGrade')
      };

      try {
        const res = await fetch(API + '?students=create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.ok) {
          closeCreateModal();
          loadStudents();
        } else {
          alert('创建失败: ' + (result.error || '未知错误'));
        }
      } catch (e) {
        alert('网络错误，请重试');
      }
    });

    // 查看学员详情
    function viewStudent(id) {
      window.location.href = '/student-detail.html?id=' + id;
    }

    // 页面加载
    loadStudents();
  </script>
</body>
</html>
