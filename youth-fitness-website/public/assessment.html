<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体能测评 - 满分虎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFE8DD 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #FF6B35;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.08);
      margin-bottom: 24px;
    }
    .card h2 {
      color: #333;
      margin-bottom: 24px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #666;
      font-size: 14px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #FF6B35;
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .result-card {
      background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
      color: white;
      padding: 32px;
      border-radius: 16px;
      text-align: center;
      margin: 24px 0;
    }
    .result-score {
      font-size: 64px;
      font-weight: 700;
      margin: 16px 0;
    }
    .result-level {
      font-size: 24px;
      font-weight: 600;
      opacity: 0.9;
    }
    .btn {
      padding: 14px 28px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }
    .btn-primary {
      background: #FF6B35;
      color: white;
      width: 100%;
    }
    .btn-primary:hover {
      background: #E55A2B;
      transform: translateY(-2px);
    }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: white;
      color: #FF6B35;
      border: 2px solid #FF6B35;
      width: 100%;
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background: #FFF5F0;
    }
    .info-banner {
      background: #FFF5F0;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      color: #666;
      font-size: 14px;
    }
    .info-banner strong {
      color: #FF6B35;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" id="backLink" class="back-btn">
      ← 返回
    </a>

    <div class="card">
      <h2>体能测评录入</h2>
      
      <div id="studentInfo" class="info-banner" style="display: none;">
        学员: <strong id="studentName"></strong> | 
        性别: <strong id="studentGender"></strong> | 
        年级: <strong id="studentGrade"></strong>
      </div>

      <form id="assessmentForm">
        <!-- 基础信息 -->
        <div class="form-row">
          <div class="form-group">
            <label>测评日期 *</label>
            <input type="date" name="date" required>
          </div>
          <div class="form-group">
            <label>年级 *</label>
            <select name="grade" id="gradeSelect" required>
              <option value="">请选择</option>
              <option value="4">四年级</option>
              <option value="5">五年级</option>
              <option value="6">六年级</option>
              <option value="7">七年级</option>
              <option value="8">八年级</option>
              <option value="9">九年级</option>
            </select>
          </div>
          <div class="form-group">
            <label>性别 *</label>
            <select name="gender" id="genderSelect" required>
              <option value="">请选择</option>
              <option value="M">男</option>
              <option value="F">女</option>
            </select>
          </div>
        </div>

        <!-- 测评模式 -->
        <div class="form-group">
          <label>测评模式 *</label>
          <select name="mode" required>
            <option value="guoti">国家学生体质健康标准</option>
            <option value="zhongkao">中考体育现场考试</option>
          </select>
        </div>

        <!-- 成绩录入 -->
        <div class="form-row">
          <div class="form-group">
            <label>总分 *</label>
            <input type="number" name="total" step="0.1" min="0" max="100" required placeholder="例: 85.5">
          </div>
          <div class="form-group">
            <label>满分</label>
            <input type="number" name="max" step="1" min="0" value="100" placeholder="例: 100">
          </div>
          <div class="form-group">
            <label>等级</label>
            <select name="level">
              <option value="">自动判定</option>
              <option value="优秀">优秀</option>
              <option value="良好">良好</option>
              <option value="及格">及格</option>
              <option value="不及格">不及格</option>
            </select>
          </div>
        </div>

        <!-- 维度评分（可选） -->
        <div class="form-group">
          <label>维度评分（可选，用于多维度分析）</label>
          <div class="form-row">
            <input type="number" name="dim_speed" step="1" min="0" max="100" placeholder="速度">
            <input type="number" name="dim_endurance" step="1" min="0" max="100" placeholder="耐力">
            <input type="number" name="dim_strength" step="1" min="0" max="100" placeholder="力量">
            <input type="number" name="dim_flexibility" step="1" min="0" max="100" placeholder="柔韧">
          </div>
        </div>

        <!-- 备注 -->
        <div class="form-group">
          <label>备注</label>
          <input type="text" name="notes" placeholder="记录特殊情况或注意事项">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">保存测评记录</button>
        <button type="button" class="btn btn-secondary" onclick="resetForm()">重置表单</button>
      </form>
    </div>
  </div>

  <script>
    const API = '/api/data';
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('studentId');
    const studentName = urlParams.get('name');
    const studentGender = urlParams.get('gender');
    const studentGrade = urlParams.get('grade');

    // 初始化页面
    function init() {
      // 设置默认日期为今天
      document.querySelector('input[name="date"]').valueAsDate = new Date();

      // 如果从学员详情页跳转，预填信息
      if (studentId && studentName) {
        document.getElementById('studentInfo').style.display = 'block';
        document.getElementById('studentName').textContent = studentName;
        document.getElementById('studentGender').textContent = studentGender === 'M' ? '男' : '女';
        document.getElementById('studentGrade').textContent = studentGrade + '年级';
        
        document.getElementById('gradeSelect').value = studentGrade;
        document.getElementById('genderSelect').value = studentGender;
        
        document.getElementById('backLink').href = '/student-detail.html?id=' + studentId;
      } else {
        document.getElementById('backLink').href = '/students.html';
      }
    }

    // 提交表单
    document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!studentId) {
        alert('缺少学员信息，无法保存记录');
        return;
      }

      const formData = new FormData(e.target);
      const dimensions = {};
      if (formData.get('dim_speed')) dimensions['速度'] = parseInt(formData.get('dim_speed'));
      if (formData.get('dim_endurance')) dimensions['耐力'] = parseInt(formData.get('dim_endurance'));
      if (formData.get('dim_strength')) dimensions['力量'] = parseInt(formData.get('dim_strength'));
      if (formData.get('dim_flexibility')) dimensions['柔韧'] = parseInt(formData.get('dim_flexibility'));

      const record = {
        date: formData.get('date'),
        grade: formData.get('grade'),
        gender: formData.get('gender'),
        mode: formData.get('mode'),
        total: parseFloat(formData.get('total')),
        max: parseInt(formData.get('max')) || 100,
        level: formData.get('level') || autoLevel(parseFloat(formData.get('total'))),
        dimensions: dimensions,
        notes: formData.get('notes') || undefined
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '保存中...';

      try {
        const res = await fetch(API + '?students=addRecord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            studentId: studentId,
            record: record
          })
        });

        const result = await res.json();
        if (result.ok) {
          alert('测评记录保存成功！');
          window.location.href = '/student-detail.html?id=' + studentId;
        } else {
          alert('保存失败: ' + (result.error || '未知错误'));
          submitBtn.disabled = false;
          submitBtn.textContent = '保存测评记录';
        }
      } catch (e) {
        alert('网络错误，请重试');
        submitBtn.disabled = false;
        submitBtn.textContent = '保存测评记录';
      }
    });

    // 自动判定等级
    function autoLevel(score) {
      if (score >= 90) return '优秀';
      if (score >= 80) return '良好';
      if (score >= 60) return '及格';
      return '不及格';
    }

    // 重置表单
    function resetForm() {
      document.getElementById('assessmentForm').reset();
      init();
    }

    init();
  </script>
</body>
</html>
